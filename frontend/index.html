<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClubVault — Transparent Club Funds. Member-Approved Spending.</title>
    <meta
      name="description"
      content="Transparent club funds and member-approved spending on MST Blockchain. Multi-member treasury governance, advance payments, and cryptographic receipt verification."
    />
    <meta name="theme-color" content="#050505" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        var h = window.location.hash.toLowerCase();
        if (h.indexOf('treasury') !== -1 || h.indexOf('app') !== -1 || h.indexOf('home') !== -1 || h.indexOf('overview') !== -1) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
        window.scrollTo(0, 0);
        window.addEventListener('beforeunload', function() {
          try {
            if ('scrollRestoration' in history) {
              history.scrollRestoration = 'manual';
            }
            var curHash = window.location.hash.toLowerCase();
            if (curHash.indexOf('treasury') !== -1 || curHash.indexOf('app') !== -1 || curHash.indexOf('home') !== -1 || curHash.indexOf('overview') !== -1) {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
          } catch(e) {}
          window.scrollTo(0, 0);
        });
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#050505] text-[#A1A1AA] antialiased selection:bg-[#FF303B]/30 selection:text-[#F5F5F7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
